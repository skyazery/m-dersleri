  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6E5A3A"/><stop offset="1" stop-color="#4A3B26"/></linearGradient>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16245A"/><stop offset="1" stop-color="#3E4F98"/></linearGradient>
