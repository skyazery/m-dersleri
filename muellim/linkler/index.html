<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>학생 개인 링크 · 교사용</title>
<link rel="stylesheet" href="../../fonts/pretendardvariable-dynamic-subset.css">
<style>
:root{--bg:#F3F5F9;--paper:#fff;--ink:#1C2A48;--soft:#5E6C87;--line:#DCE2EC;--teal:#2C8A84;--wa:#25D366;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111829;--paper:#1A2340;--ink:#EBF0F8;--soft:#A8B5CC;--line:#2C385A;--teal:#5CC2B9;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Segoe UI","Noto Sans KR",sans-serif;line-height:1.55;word-break:keep-all}
.wrap{max-width:760px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left)) 60px;display:flex;flex-direction:column;gap:18px}
a.back{color:var(--teal);font-weight:700;text-decoration:none;font-size:14px}
h1{margin:0;font-size:26px;font-weight:900}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:17px}
.note{margin:0;color:var(--soft);font-size:14px}
form{display:grid;grid-template-columns:1.2fr 1fr 1.2fr auto;gap:8px}
@media (max-width:620px){form{grid-template-columns:1fr 1fr}form button,form #tel{grid-column:1/-1}}
input,select{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);min-width:0}
button{font:inherit;font-weight:700;border-radius:10px;padding:10px 14px;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--teal)}
button.del{background:transparent;border-color:var(--line);color:var(--soft);padding:8px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column;gap:10px}
.st{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.st .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.st b{font-size:18px}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--soft)}
.url{font-size:13px;color:var(--soft);word-break:break-all;background:var(--bg);border-radius:8px;padding:6px 8px}
a.wa{display:inline-flex;align-items:center;gap:6px;background:var(--wa);color:#fff;border-radius:10px;padding:9px 14px;font-weight:800;text-decoration:none}
.tel{width:170px}
.msg{font-size:14px;color:var(--teal);min-height:1.2em}
.empty{color:var(--soft);text-align:center;padding:20px}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="../">← 교사용 첫 화면</a>
<h1>학생 개인 링크</h1>
<p class="note">학생 이름을 미리 넣어 둔 개인 링크를 만들어 WhatsApp으로 보냅니다. 학생이 이 링크로 들어오면 이름 입력 없이 바로 공부하고, 결과가 그 이름으로 구글 시트에 저장됩니다.</p>

<section class="card">
<h2>학생 추가</h2>
<form id="add">
<input id="ad" maxlength="30" placeholder="이름 (예: Aysel)" required aria-label="이름">
<select id="q" aria-label="반">
<option value="az">Azərbaycanca · Uşaqlar</option>
<option value="az-genc">Azərbaycanca · Yeniyetmələr</option>
<option value="ko-usaq">한국어 · 어린이</option>
<option value="ko-genc">한국어 · 청소년</option>
<option value="ru">Русский · Дети</option>
<option value="ru-genc">Русский · Подростки</option>
<option value="en">English · Children</option>
<option value="en-genc">English · Teens</option>
</select>
<input id="tel" inputmode="tel" placeholder="WhatsApp 번호 (선택, +995…)" aria-label="WhatsApp 번호">
<button type="submit">추가</button>
</form>
<div class="row">
<button class="ghost" type="button" id="load">구글 시트 ‘명단’에서 이름 가져오기</button>
<span class="msg" id="msg"></span>
</div>
<p class="note">이름은 성 없이 이름만 써 주세요. 전화번호는 이 기기에만 저장되고 사이트나 시트에는 올라가지 않습니다.</p>
</section>

<section>
<div class="list" id="list"></div>
</section>
</div>
<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbzpx5LBqs88_WiBL27NbdiaM0xDYjVHWJBDA12EW1wVlyllqQCzJqW4nwD1JpMe25Q/exec';
const KEY='mders-linkler';
const LBL={'az':'Azərbaycanca · Uşaqlar','az-genc':'Azərbaycanca · Yeniyetmələr','ko-usaq':'한국어 · 어린이','ko-genc':'한국어 · 청소년','ru':'Русский · Дети','ru-genc':'Русский · Подростки','en':'English · Children','en-genc':'English · Teens'};
const BASE=new URL('../../',location.href).href;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
let S=load();
const clean=v=>String(v||'').replace(/\s+/g,' ').trim().slice(0,30);
function link(s){return BASE+'?ad='+encodeURIComponent(s.ad)+'&q='+s.q;}
function text(s){
 const u=link(s);
 if(s.q.startsWith('az'))return 'Salam, '+s.ad+'! 👋\nBu sənin Müqəddəs Kitab dərsləri linkindir:\n'+u+'\n\nHər dəfə bu linklə aç ki, nəticələrin müəlliminə çatsın. 📖';
 if(s.q.startsWith('ru'))return 'Привет, '+s.ad+'! 👋\nЭто твоя ссылка на уроки по Библии:\n'+u+'\n\nОткрывай уроки всегда по этой ссылке, чтобы учитель видел твои результаты. 📖';
 if(s.q.startsWith('en'))return 'Hi, '+s.ad+'! 👋\nHere is your Bible lessons link:\n'+u+'\n\nAlways open your lessons with this link so your teacher can see your results. 📖';
 return s.ad+', 안녕! 👋\n너만의 성경교재 링크야:\n'+u+'\n\n공부할 때마다 이 링크로 들어와 줘. 📖';
}
function wa(s){const t=encodeURIComponent(text(s));let n=(s.tel||'').replace(/[^0-9]/g,'');if(/^0?5\d{8}$/.test(n))n='995'+n.replace(/^0/,'');return 'https://wa.me/'+(n?n:'')+'?text='+t;}
function copyOld(t){const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok;}
async function copy(t,btn,lbl){let ok=false;
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);ok=true;}}catch(e){}
 if(!ok)ok=copyOld(t);
 if(ok){btn.textContent='복사됨 ✓';setTimeout(()=>btn.textContent=lbl,1800);}else prompt('아래 내용을 길게 눌러 복사하세요',t);}
function render(){
 const L=document.getElementById('list');L.innerHTML='';
 if(!S.length){L.innerHTML='<p class="empty">아직 학생이 없어요. 위에서 추가해 주세요.</p>';return;}
 S.forEach((s,i)=>{
  const d=document.createElement('div');d.className='st';
  d.innerHTML='<div class="top"><b></b><span class="tag"></span></div><div class="url"></div><div class="row"><a class="wa" target="_blank" rel="noopener">WhatsApp으로 보내기</a><button class="ghost cp" type="button">링크 복사</button><button class="ghost cm" type="button">메시지 복사</button><input class="tel" inputmode="tel" placeholder="번호 (선택)"><button class="del" type="button" aria-label="삭제">삭제</button></div>';
  d.querySelector('b').textContent=s.ad;d.querySelector('.tag').textContent=LBL[s.q];
  d.querySelector('.url').textContent=link(s);
  const a=d.querySelector('.wa');a.href=wa(s);
  const t=d.querySelector('.tel');t.value=s.tel||'';
  t.onchange=()=>{s.tel=t.value.trim();save(S);a.href=wa(s);};
  d.querySelector('.cp').onclick=e=>copy(link(s),e.target,'링크 복사');
  d.querySelector('.cm').onclick=e=>copy(text(s),e.target,'메시지 복사');
  d.querySelector('.del').onclick=()=>{if(confirm(s.ad+' 학생을 목록에서 지울까요?')){S.splice(i,1);save(S);render();}};
  L.appendChild(d);
 });
}
function addOne(ad,q,tel){ad=clean(ad);if(!ad)return false;if(S.some(s=>s.ad.toLowerCase()===ad.toLowerCase()&&s.q===q))return false;S.push({ad,q,tel:tel||''});return true;}
document.getElementById('add').onsubmit=e=>{e.preventDefault();const ad=document.getElementById('ad');
 if(addOne(ad.value,document.getElementById('q').value,document.getElementById('tel').value.trim())){save(S);render();ad.value='';document.getElementById('tel').value='';ad.focus();}
 else document.getElementById('msg').textContent='이미 있거나 이름이 비어 있어요.';};
document.getElementById('load').onclick=async()=>{
 const m=document.getElementById('msg');m.textContent='불러오는 중…';let n=0;
 for(const [sinif,q] of [['usaq','az'],['genc','az-genc'],['ko-usaq','ko-usaq'],['ko-genc','ko-genc'],['ru','ru'],['ru-genc','ru-genc'],['en','en'],['en-genc','en-genc']]){
  try{const r=await fetch(ENDPOINT+'?siyahi='+sinif);const d=await r.json();(d.names||[]).forEach(x=>{if(addOne(x,q,''))n++;});}catch(e){}
 }
 save(S);render();m.textContent=n?n+'명을 추가했어요.':'새로 추가할 이름이 없어요. (시트 ‘명단’을 확인해 주세요)';
};
render();
</script>
</body>
</html>
