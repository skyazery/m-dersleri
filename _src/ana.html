<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0F1F">
<title>성경교재 · Müqəddəs Kitab dərsləri</title>
<link rel="stylesheet" href="fonts/pretendardvariable-dynamic-subset.css">
<style>
/* Üç görünüş: seçim (tünd) · uşaqlar = "Mənim yolum" (açıq, nişanlar) · yeniyetmələr = "Hər gün birlikdə" (tünd, ardıcıllıq) */
:root{
 --bg:#0A0F1F;--ink:#F3F5FB;--soft:#9AA6C3;--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.1);--edge:rgba(255,255,255,.12);--teal:#4FD1C5;--violet:#8B7CF6;--gold:#F6C766;
 --k-bg:#FFF8EC;--k-ink:#23324A;--k-soft:#6A5A3E;--k-line:#F0DFC0;--k-card:#FFFFFF;--k-accent:#1E5FD9;--k-sun:#FFD15C;--k-ok:#2E9C6A;--k-warm:#B5651D;
 --t-bg:#0E1424;--t-card:#161E33;--t-line:#263152;--t-chip:#1B2338;--t-ink:#EEF2FA;--t-soft:#9AA6C3;--t-mint:#7FE0D0;--t-hot:#FF8A4C;
 color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Segoe UI","Noto Sans KR",sans-serif;line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body.kid,html.kid{background:var(--k-bg);color-scheme:light}
body.teen,html.teen{background:var(--t-bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}

/* ---------- seçim ---------- */
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(40% 35% at 15% 8%,rgba(79,209,197,.28),transparent 70%),radial-gradient(45% 40% at 90% 20%,rgba(139,124,246,.30),transparent 70%),radial-gradient(50% 40% at 50% 100%,rgba(246,199,102,.12),transparent 70%)}
body.kid .glow,body.teen .glow{display:none}
#pick header{text-align:center;margin:16px 0 30px}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);padding:6px 12px;border:1px solid var(--edge);border-radius:999px;background:var(--glass)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}
#pick h1{margin:16px 0 6px;font-size:clamp(46px,14vw,72px);font-weight:900;letter-spacing:-.04em;line-height:1.05;background:linear-gradient(120deg,#fff 20%,var(--gold) 60%,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
#pick header p{margin:0;color:var(--soft);font-size:15px}
.group{margin:0 0 16px}
.group h2{margin:0 0 10px;font-size:12px;font-weight:800;color:var(--soft);letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.group h2::after{content:"";flex:1;height:1px;background:var(--edge)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns button{text-align:left;padding:16px;border-radius:20px;border:1px solid var(--edge);background:var(--glass);cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .15s,border-color .15s}
.btns button:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.25)}
.btns .em{font-size:26px;line-height:1}
.btns b{font-size:18px;font-weight:800}
.btns small{font-size:12px;color:var(--soft)}
footer{margin-top:40px;text-align:center;color:var(--soft);font-size:12px;letter-spacing:.06em}

/* ---------- ortaq ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.langs{display:flex;gap:4px;border-radius:999px;padding:4px}
.langs a{font-size:13px;font-weight:800;padding:7px 10px;border-radius:999px;text-decoration:none;min-width:36px;text-align:center}
.back{font-size:13px;font-weight:700;text-decoration:none;opacity:.8}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list a{display:flex;align-items:center;gap:12px;text-decoration:none;border-radius:16px;padding:8px 12px 8px 8px}
.list img{width:56px;height:42px;border-radius:10px;object-fit:cover;flex:none;background:#ddd}
.list .tt{flex:1;min-width:0;display:flex;flex-direction:column}
.list .tt b{font-size:15px;font-weight:800;line-height:1.3}
.list .tt small{font-size:12px}
.st{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h2{margin:0;font-size:16px;font-weight:900}

/* ---------- uşaqlar (A) ---------- */
#kid{color:var(--k-ink);display:flex;flex-direction:column;gap:20px}
#kid .hi small{display:block;font-size:14px;font-weight:700;color:var(--k-soft)}
#kid .hi b{font-size:28px;font-weight:900;line-height:1.1}
#kid .langs{background:var(--k-card);border:2px solid var(--k-line)}
#kid .langs a{color:var(--k-soft)}
#kid .langs a[aria-current]{background:var(--k-ink);color:#fff}
#kid .back{color:var(--k-soft)}
.ring{background:var(--k-accent);border-radius:26px;padding:20px;display:flex;gap:18px;align-items:center;color:#fff}
.ring .c{position:relative;width:108px;height:108px;flex:none}
.ring .c div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:32px;font-weight:900;line-height:1}
.ring .c span{font-size:12px;font-weight:800;opacity:.85}
.ring .tx{display:flex;flex-direction:column;gap:6px;min-width:0}
.ring .tx small{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.ring .tx b{font-size:19px;font-weight:900;line-height:1.25}
.ring .tx span{font-size:14px;font-weight:700;opacity:.92}
.next{background:var(--k-card);border-radius:22px;border:2px solid var(--k-line);overflow:hidden;display:flex;flex-direction:column}
.next img{width:100%;height:auto;aspect-ratio:16/8;object-fit:cover;display:block;max-width:100%}
.next .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.next small{font-size:13px;font-weight:800;color:var(--k-warm)}
.next h3{margin:0;font-size:21px;font-weight:900;line-height:1.25}
.go{align-self:flex-start;background:var(--k-ink);color:#fff;font-size:16px;font-weight:900;padding:12px 24px;border-radius:14px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.bd{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.bd i{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.bd i.off{border:2px dashed #D9C7A4}
.bd span{font-size:12px;font-weight:800;line-height:1.25}
.bd.off span{color:var(--k-soft);font-weight:700}
#kid .list a{background:var(--k-card);color:var(--k-ink);border:2px solid transparent}
#kid .list a.now{border-color:var(--k-accent)}
#kid .list small{color:var(--k-soft)}
#kid .now-t{font-size:12px;font-weight:900;color:var(--k-accent);flex:none}
.half{width:26px;height:26px;border-radius:50%;border:3px solid var(--k-sun);flex:none}

/* ---------- yeniyetmələr (C) ---------- */
#teen{color:var(--t-ink);display:flex;flex-direction:column;gap:18px}
#teen .hi{font-size:23px;font-weight:900;letter-spacing:-.01em;line-height:1.2}
.streak{display:flex;align-items:center;gap:6px;background:var(--t-chip);border-radius:999px;padding:7px 12px;font-weight:800;font-size:15px}
#teen .langs{background:var(--t-chip)}
#teen .langs a{color:var(--t-soft)}
#teen .langs a[aria-current]{background:var(--t-ink);color:var(--t-bg)}
#teen .back{color:var(--t-soft)}
.card{background:var(--t-card);border:1px solid var(--t-line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card .lbl{font-size:13px;font-weight:700;color:var(--t-soft)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.week div{display:flex;flex-direction:column;gap:6px;align-items:center}
.week span{font-size:12px;color:var(--t-soft)}
.week i{width:34px;height:34px;border-radius:50%;background:var(--t-line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:800;color:var(--t-ink)}
.week i.on{background:var(--t-hot)}
.week i.today{box-sizing:border-box;border:2px solid var(--t-hot);background:transparent}
.week i.today.on{background:var(--t-hot)}
.today-c{position:relative;border-radius:24px;overflow:hidden;min-height:300px;display:flex;background:#1a2238}
.today-c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.today-c .in{position:relative;margin-top:auto;width:100%;padding:18px;background:rgba(10,15,31,.88);display:flex;flex-direction:column;gap:8px}
.today-c small{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--t-mint)}
.today-c h3{margin:0;font-size:23px;font-weight:900;line-height:1.2}
.today-c .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.today-c .row span{font-size:13px;color:#C4CCE0}
.go2{background:var(--t-mint);color:var(--t-bg);font-size:15px;font-weight:900;padding:11px 20px;border-radius:12px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.mates{display:flex;align-items:center;gap:12px}
.av{display:flex;flex:none}
.av span{width:36px;height:36px;border-radius:50%;border:2px solid var(--t-card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--t-bg)}
.av span+span{margin-left:-10px}
.mates p{margin:0;font-size:14px;line-height:1.45;color:#C4CCE0}
.verse{background:var(--t-chip);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.verse p{margin:0;font-size:16px;line-height:1.55}
.verse span{font-size:13px;color:var(--t-soft)}
#teen .list a{background:var(--t-card);color:var(--t-ink)}
#teen .list a.now{box-shadow:0 0 0 1.5px var(--t-mint)}
#teen .list small{color:var(--t-soft)}
#teen .now-t{font-size:11px;font-weight:900;color:var(--t-mint);flex:none;letter-spacing:.06em}
#teen .half{border-color:var(--t-hot)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="wrap">

<section id="pick" hidden>
<header>
<span class="pill"><i></i>Matta · 마태복음 · 33</span>
<h1>성경교재</h1>
<p>Müqəddəs Kitab dərsləri</p>
</header>
<div class="group"><h2>Azərbaycanca</h2><div class="btns">
<button type="button" data-k="az"><span class="em">🧒</span><b>Uşaqlar</b><small>🔊 Səsli oxu ilə</small></button>
<button type="button" data-k="az-genc"><span class="em">🎧</span><b>Yeniyetmələr</b><small>🔊 Səsli oxu ilə</small></button>
</div></div>
<div class="group"><h2>한국어</h2><div class="btns">
<button type="button" data-k="ko-usaq"><span class="em">🧒</span><b>어린이</b><small>그림 이야기와 퀴즈</small></button>
<button type="button" data-k="ko-genc"><span class="em">🎧</span><b>청소년</b><small>배경 · 원어 · 나눔</small></button>
</div></div>
<div class="group"><h2>Русский</h2><div class="btns">
<button type="button" data-k="ru"><span class="em">🧒</span><b>Дети</b><small>🔊 С озвучкой</small></button>
<button type="button" data-k="ru-genc"><span class="em">🎧</span><b>Подростки</b><small>🔊 С озвучкой</small></button>
</div></div>
<div class="group"><h2>English</h2><div class="btns">
<button type="button" data-k="en"><span class="em">🧒</span><b>Children</b><small>🔊 With audio</small></button>
<button type="button" data-k="en-genc"><span class="em">🎧</span><b>Teens</b><small>🔊 With audio</small></button>
</div></div>
<footer>MATTANIN YAZDIĞI MÜJDƏ · 마태복음</footer>
</section>

<section id="kid" hidden aria-live="polite"></section>
<section id="teen" hidden aria-live="polite"></section>
</div>
<script>
const D=/*DATA*/;
const ENDPOINT='https://script.google.com/macros/s/AKfycbzpx5LBqs88_WiBL27NbdiaM0xDYjVHWJBDA12EW1wVlyllqQCzJqW4nwD1JpMe25Q/exec';
const KID={az:'az',ko:'ko-usaq',ru:'ru',en:'en'}, TEEN={az:'az-genc',ko:'ko-genc',ru:'ru-genc',en:'en-genc'};
const U={
 az:{hi:'Salam',guest:'Xoş gəldin!',book:'Matta',path:'Mənim yolum',of:'/ 33 dərs',
  msg:d=>d===0?'Birinci dərsdən başla!':d>=33?'Matta Müjdəsini bitirdin! 🎉':d>=11&&d<22?'Matta Müjdəsinin üçdə birini keçdin!':d>=22?'Az qaldı, davam et!':d+' dərs bitirdin. Afərin!',
  verses:n=>n+' ayə əzbərlədin',next:'Növbəti dərs',again:'Yenidən oxu',cont:'Davam et',start:'Başla',badges:'Nişanlarım',lessons:'Bütün dərslər',now:'İNDİ',change:'Dil və qrup',
  week:'Bu həftə',days:['B.e','Ç.a','Ç','C.a','C','Ş','B'],today:'Bu gün',streak:n=>n+' gün',todayLesson:'Bu günün dərsi',mates:'Sinif yoldaşların',
  matesMsg:n=>n+' nəfər bu dərsi artıq bitirib. Sən də qoşul!',verse:'Əzbər ayə',lesson:n=>ord(n)+' dərs',
  b:['İlk dərs','5 dərs','5 ayə','Tam test','3 gün ardıcıl','10 dərs','20 dərs','Matta tamam']},
 ko:{hi:'안녕',guest:'환영해요!',book:'마태복음',path:'나의 길',of:'/ 33과',
  msg:d=>d===0?'1과부터 시작해요!':d>=33?'마태복음을 모두 마쳤어요! 🎉':d>=11&&d<22?'마태복음의 3분의 1을 넘었어요!':d>=22?'거의 다 왔어요, 힘내요!':d+'과를 마쳤어요. 잘했어요!',
  verses:n=>'말씀 '+n+'개를 외웠어요',next:'다음 과',again:'다시 읽기',cont:'이어 하기',start:'시작',badges:'나의 배지',lessons:'모든 과',now:'지금',change:'언어·반 바꾸기',
  week:'이번 주',days:['월','화','수','목','금','토','일'],today:'오늘',streak:n=>n+'일',todayLesson:'오늘의 과',mates:'우리 반 친구들',
  matesMsg:n=>n+'명이 이 과를 벌써 마쳤어요. 함께해요!',verse:'외울 말씀',lesson:n=>'제'+n+'과',
  b:['첫 과','5과','말씀 5개','퀴즈 만점','3일 연속','10과','20과','마태복음 완주']},
 ru:{hi:'Привет',guest:'Добро пожаловать!',book:'Матфей',path:'Мой путь',of:'/ 33 урока',
  msg:d=>d===0?'Начни с первого урока!':d>=33?'Ты прошёл всё Евангелие от Матфея! 🎉':d>=11&&d<22?'Ты прошёл треть Евангелия от Матфея!':d>=22?'Осталось немного, продолжай!':'Пройдено уроков: '+d+'. Молодец!',
  verses:n=>'Выучено стихов: '+n,next:'Следующий урок',again:'Прочитать снова',cont:'Продолжить',start:'Начать',badges:'Мои значки',lessons:'Все уроки',now:'СЕЙЧАС',change:'Язык и группа',
  week:'Эта неделя',days:['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],today:'Сегодня',streak:n=>n+' дн.',todayLesson:'Урок на сегодня',mates:'Одноклассники',
  matesMsg:n=>'Уже прошли этот урок: '+n+'. Присоединяйся!',verse:'Стих для заучивания',lesson:n=>'Урок '+n,
  b:['Первый урок','5 уроков','5 стихов','Тест без ошибок','3 дня подряд','10 уроков','20 уроков','Весь Матфей']},
 en:{hi:'Hi',guest:'Welcome!',book:'Matthew',path:'My journey',of:'/ 33 lessons',
  msg:d=>d===0?'Start with the first lesson!':d>=33?'You finished the Gospel of Matthew! 🎉':d>=11&&d<22?'You are a third of the way through Matthew!':d>=22?'Almost there, keep going!':d+' lessons done. Well done!',
  verses:n=>n+' verses memorized',next:'Next lesson',again:'Read again',cont:'Continue',start:'Start',badges:'My badges',lessons:'All lessons',now:'NOW',change:'Language & group',
  week:'This week',days:['Mo','Tu','We','Th','Fr','Sa','Su'],today:'Today',streak:n=>n+(n===1?' day':' days'),todayLesson:'Today’s lesson',mates:'Your classmates',
  matesMsg:n=>n+(n===1?' classmate has':' classmates have')+' finished this lesson. Join them!',verse:'Memory verse',lesson:n=>'Lesson '+n,
  b:['First lesson','5 lessons','5 verses','Perfect quiz','3 days in a row','10 lessons','20 lessons','All of Matthew']}
};
function ord(n){const t=n%10;let s;if(t===0)s={10:'cu',20:'ci',30:'cu'}[n%100]||'cu';else s={1:'ci',2:'ci',5:'ci',7:'ci',8:'ci',3:'cü',4:'cü',6:'cı',9:'cu'}[t];return n+'-'+s;}
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function lsKeys(){const o=[];try{for(let i=0;i<localStorage.length;i++)o.push(localStorage.key(i))}catch(e){}return o}
const qs=new URLSearchParams(location.search);
let ad=(qs.get('ad')||'').replace(/\s+/g,' ').trim().slice(0,30);
if(ad)ls('mders-ad',ad);else ad=(ls('mders-ad')||'').trim();
let mc=(qs.get('m')||'').toLowerCase();
if(/^[a-z0-9-]{1,20}$/.test(mc))ls('mders-m',mc);else mc=(ls('mders-m')||'');
const tail=ad?'?ad='+encodeURIComponent(ad):'';

/* ---- şagirdin cihazdakı izləri (ders-izle.js yazır) ---- */
function stats(k){
  const lang=k.slice(0,2), sfx='|'+ad;
  const did=n=>lang==='az'?'matta-'+pad(n):'matta-'+pad(n)+'-'+lang;
  const st={}, days=new Set(); let verses=0, perfect=0;
  for(const r of D[k]){
    const id=did(r[0]);
    const p=parseInt(ls('mders-proq-'+id+sfx)||'0',10), t=ls('mders-test-'+id+sfx), v=!!ls('mders-ayə-'+id+sfx);
    if(v)verses++;
    if(t){const m=t.split('/');if(m[0]===m[1])perfect++;}
    st[r[0]]={done:p>=100||!!t,started:p>0};
  }
  if(ad)for(const key of lsKeys()){
    const m=/^mders-gun-.+-(\d{4})-(\d{1,2})-(\d{1,2})\|(.*)$/.exec(key||'');
    if(m&&m[4]===ad)days.add(m[1]+'-'+(+m[2])+'-'+(+m[3]));
  }
  const dk=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  const today=new Date();today.setHours(12,0,0,0);
  let streak=0;const c=new Date(today);
  if(!days.has(dk(c)))c.setDate(c.getDate()-1);
  while(days.has(dk(c))){streak++;c.setDate(c.getDate()-1);}
  let best=0,run=0;const all=[...days].map(s=>{const[a,b,d]=s.split('-');return new Date(+a,+b-1,+d,12)}).sort((x,y)=>x-y);
  all.forEach((d,i)=>{run=i&&Math.round((d-all[i-1])/864e5)===1?run+1:1;if(run>best)best=run;});
  const done=Object.values(st).filter(x=>x.done).length;
  const nextRow=D[k].find(r=>!st[r[0]].done)||null;
  return {st,done,verses,perfect,streak,best,days,dk,today,nextRow,did};
}

const ICON={
 star:'<path d="M12 3l2.6 5.6 6 .7-4.4 4.1 1.2 6L12 16.5 6.6 19.4l1.2-6L3.4 9.3l6-.7z"/>',
 book:'<path d="M4 5h11a3 3 0 0 1 3 3v12H7a3 3 0 0 1-3-3z"/><path d="M8 9h6M8 13h6"/>',
 check:'<path d="M5 12l4 4L19 6"/>',
 flame:'<path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.8 2.5-5 .3 1.5 1.2 2.4 2 2.5C11 8 11 5 12 3z"/>',
 trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 crown:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>'
};
const svg=(n,c,s=28,w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
function langBar(k,map){
  const cur=k.slice(0,2);
  return '<nav class="langs" aria-label="Dil">'+['az','ko','ru','en'].map(l=>`<a href="?q=${map[l]}" data-k="${map[l]}"${l===cur?' aria-current="true"':''}>${l.toUpperCase()}</a>`).join('')+'</nav>';
}
function lessonList(k,S,u){
  return '<ol class="list">'+D[k].map(r=>{
    const s=S.st[r[0]],now=S.nextRow&&S.nextRow[0]===r[0];
    const mark=s.done?`<span class="st" style="background:var(--k-ok)">${svg('check','#fff',14,3)}</span>`:now?`<span class="now-t">${u.now}</span>`:s.started?'<span class="half" aria-hidden="true"></span>':'';
    return `<li><a href="matta-${pad(r[0])}-${k}/${tail}"${now?' class="now"':''}><img src="img/th/matta-${pad(r[0])}.jpg" alt="" loading="lazy" width="56" height="42"><span class="tt"><b>${r[0]} · ${esc(r[2])}</b><small>${u.book} ${esc(r[1])}</small></span>${mark}</a></li>`}).join('')+'</ol>';
}

function renderKid(k){
  const u=U[k.slice(0,2)],S=stats(k),R=S.nextRow||D[k][D[k].length-1];
  const pct=Math.min(1,S.done/33),C=2*Math.PI*46;
  const earned=[S.done>=1,S.done>=5,S.verses>=5,S.perfect>=1,S.best>=3,S.done>=10,S.done>=20,S.done>=33];
  const bi=['star','book','book','check','flame','trophy','trophy','crown'],bc=['#FFD15C','#8FD3C1','#BFD7FF','#F7A8A0','#FFB27A','#C9B6F5','#9FD9A8','#FFD15C'];
  document.getElementById('kid').innerHTML=`
  <div class="top"><div class="hi"><small>${ad?u.hi+',':''}</small><b>${ad?esc(ad)+'!':u.guest}</b></div>${langBar(k,KID)}</div>
  <div class="ring"><div class="c"><svg width="108" height="108" viewBox="0 0 108 108" aria-hidden="true"><circle cx="54" cy="54" r="46" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="12"/><circle cx="54" cy="54" r="46" fill="none" stroke="#FFD15C" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 54 54)"/></svg><div><b>${S.done}</b><span>${u.of}</span></div></div>
   <div class="tx"><small>${u.path}</small><b>${u.msg(S.done)}</b>${S.verses?`<span>${u.verses(S.verses)}</span>`:''}</div></div>
  <div class="next"><img src="img/th/md-${pad(R[0])}.jpg" alt="" width="800" height="400"><div class="in"><small>${S.nextRow?u.next:u.again} · ${u.lesson(R[0])}</small><h3>${esc(R[2])}</h3><a class="go" href="matta-${pad(R[0])}-${k}/${tail}">${S.done||S.st[R[0]].started?u.cont:u.start}</a></div></div>
  <div class="sec"><h2>${u.badges}</h2><div class="badges">${u.b.map((t,i)=>earned[i]?`<div class="bd"><i style="background:${bc[i]}">${svg(bi[i],'#23324A')}</i><span>${t}</span></div>`:`<div class="bd off"><i class="off">${svg('lock','#A8957A',24)}</i><span>${t}</span></div>`).join('')}</div></div>
  <div class="sec"><h2>${u.lessons}</h2>${lessonList(k,S,u)}</div>
  <a class="back" href="#" data-pick>← ${u.change}</a>`;
}

function renderTeen(k){
  const u=U[k.slice(0,2)],S=stats(k),R=S.nextRow||D[k][D[k].length-1];
  const mon=new Date(S.today);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  let week='';for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const on=S.days.has(S.dk(d)),td=S.dk(d)===S.dk(S.today);
    week+=`<div><span${td?' style="color:var(--t-ink);font-weight:800"':''}>${u.days[i]}</span><i class="${on?'on':''}${td?' today':''}">${td&&!on?esc(u.today):''}</i></div>`;}
  const v=R[3];
  document.getElementById('teen').innerHTML=`
  <div class="top"><span class="hi">${ad?u.hi+', '+esc(ad):u.guest}</span><span class="streak" title="${esc(u.streak(S.streak))}">${svg('flame','#FF8A4C',18,2.2)}${u.streak(S.streak)}</span></div>
  ${langBar(k,TEEN)}
  <div class="card"><span class="lbl">${u.week}</span><div class="week">${week}</div></div>
  <div class="today-c"><img src="img/th/md-${pad(R[0])}.jpg" alt=""><div class="in"><small>${S.nextRow?u.todayLesson:u.again} · ${R[0]}</small><h3>${esc(R[2])}</h3><div class="row"><span>${u.book} ${esc(R[1])} · ${S.done} ${u.of}</span><a class="go2" href="matta-${pad(R[0])}-${k}/${tail}">${S.st[R[0]].started?u.cont:u.start}</a></div></div></div>
  <div class="card" id="mates" hidden></div>
  ${v?`<div class="sec"><h2>${u.verse}</h2><div class="verse"><p>${esc(v[0])}</p><span>${/^\d/.test(v[1]||'1')?u.book+' ':''}${esc(v[1]||R[1])}</span></div></div>`:''}
  <div class="sec"><h2>${u.lessons}</h2>${lessonList(k,S,u)}</div>
  <a class="back" href="#" data-pick>← ${u.change}</a>`;
  // sinif yoldaşları (cədvəldən; olmasa kart görünmür)
  const id=S.did(R[0]);
  fetch(ENDPOINT+'?bitirib='+id+'&sinif=genc'+(mc?'&m='+mc:'')).then(r=>r.json()).then(d=>{
    if(!d||!(d.n>0))return;const box=document.getElementById('mates');if(!box)return;
    const cols=['#8B7CF6','#F6C766','#4FD1C5','#FF8A4C'];
    box.innerHTML=`<span class="lbl" style="color:var(--t-ink);font-size:16px;font-weight:800">${u.mates}</span><div class="mates"><div class="av">${(d.h||[]).map((h,i)=>`<span style="background:${cols[i%4]}">${esc(h)}</span>`).join('')}${d.n>4?`<span style="background:var(--t-line);color:var(--t-ink);font-size:12px">+${d.n-4}</span>`:''}</div><p>${u.matesMsg(d.n)}</p></div>`;
    box.hidden=false;
  }).catch(()=>{});
}

function show(k,save){
  const teen=/genc$/.test(k), body=document.body, html=document.documentElement;
  body.className=html.className=teen?'teen':'kid';
  html.lang=k.slice(0,2);
  document.getElementById('pick').hidden=true;
  document.getElementById('kid').hidden=teen;document.getElementById('teen').hidden=!teen;
  (teen?renderTeen:renderKid)(k);
  document.querySelector('meta[name=theme-color]').content=teen?'#0E1424':'#FFF8EC';
  if(save)ls('ana-secim',k);
}
function pick(){
  document.body.className=document.documentElement.className='';
  document.documentElement.lang='ko';
  document.getElementById('pick').hidden=false;document.getElementById('kid').hidden=true;document.getElementById('teen').hidden=true;
  document.querySelector('meta[name=theme-color]').content='#0A0F1F';
  window.scrollTo(0,0);
}
document.querySelectorAll('#pick .btns button').forEach(b=>b.addEventListener('click',()=>{show(b.dataset.k,true);window.scrollTo(0,0);}));
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-k],a[data-pick]');if(!a)return;e.preventDefault();
  if(a.hasAttribute('data-pick'))pick();else{show(a.dataset.k,true);}
});
let k0=qs.get('q')||location.hash.slice(1);
if(D[k0])ls('ana-secim',k0);else k0=ls('ana-secim');
if(D[k0])show(k0,false);else pick();
</script>
</body>
</html>
