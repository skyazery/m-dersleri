<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Müqəddəs Kitab dərsləri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Gowun+Dodum&display=swap">
<style>
:root{--bg:#EEF2F8;--paper:#fff;--ink:#1C2A48;--soft:#5A6A88;--line:#D9E0EC;--gold:#D9A23B;--teal:#2C8A84;--teal-soft:#DCEFEC;--night:#1A2550;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111829;--paper:#1A2340;--ink:#EBF0F8;--soft:#A8B5CC;--line:#2C385A;--gold:#EDB650;--teal:#5CC2B9;--teal-soft:#173A39;--night:#0B1228;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Gowun Dodum","Segoe UI",sans-serif;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 60px;display:flex;flex-direction:column;gap:22px}
.hero{border-radius:24px;overflow:hidden;background:var(--night);color:#F6F1E4}
.hero svg{display:block;width:100%;height:auto}
.hero div{padding:16px 22px 22px}
.hero h1{margin:0;font-weight:900;font-size:clamp(28px,7vw,40px);color:#FFF8E8;line-height:1.2}
.hero p{margin:6px 0 0;color:#C7D0E6;font-family:"Gowun Dodum",sans-serif}
h2{margin:0;font-weight:900;font-size:22px}
.card{background:var(--paper);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.card .eyebrow{font-size:13px;letter-spacing:.06em;color:var(--gold);font-weight:800}
.card h3{margin:0;font-weight:900;font-size:22px}
.card .ref{color:var(--soft);font-size:14px}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.links a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.links a:hover,.links a:focus-visible{border-color:var(--teal);outline:none}
.links a.main{background:var(--teal);border-color:var(--teal);color:#fff}
.links b{font-weight:800}
.links small{font-family:"Gowun Dodum",sans-serif;opacity:.8}
.soon{opacity:.6}
footer{color:var(--soft);font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="wrap">

<radialGradient id="hGlow"><stop offset="0" stop-color="#FFF1C4" stop-opacity=".85"/><stop offset=".35" stop-color="#FFE7A8" stop-opacity=".25"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient>
<linearGradient id="hBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF1C4" stop-opacity=".28"/><stop offset="1" stop-color="#FFF1C4" stop-opacity="0"/></linearGradient>
</defs>
<rect width="800" height="340" fill="url(#hSky)"/>
<g fill="#FFF6DA"><circle cx="48" cy="38" r="1.6"/><circle cx="120" cy="92" r="1.2"/><circle cx="196" cy="30" r="1.8"/><circle cx="280" cy="70" r="1.1"/><circle cx="360" cy="24" r="1.5"/><circle cx="430" cy="96" r="1.2"/><circle cx="700" cy="40" r="1.7"/><circle cx="752" cy="110" r="1.2"/><circle cx="650" cy="130" r="1"/><circle cx="92" cy="150" r="1"/><circle cx="240" cy="140" r="1.1"/></g>
<polygon points="572,96 580,96 690,340 470,340" fill="url(#hBeam)"/>

<path d="M576 46 L582 76 L612 82 L582 88 L576 118 L570 88 L540 82 L570 76Z" fill="#FFF4D0"/>
<path d="M0 238 C120 205 220 214 330 228 S560 198 800 226 V340 H0Z" fill="#33467E"/>
<g fill="#28396A"><rect x="430" y="196" width="34" height="30" rx="2"/><rect x="460" y="184" width="40" height="42" rx="2"/><rect x="498" y="200" width="30" height="26" rx="2"/><rect x="526" y="190" width="38" height="36" rx="2"/><rect x="560" y="204" width="28" height="22" rx="2"/><path d="M470 184 a10 10 0 0 1 20 0z"/></g>
<g fill="#F2C46B"><rect x="474" y="198" width="6" height="8" rx="1"/><rect x="540" y="202" width="6" height="7" rx="1"/><rect x="442" y="206" width="5" height="7" rx="1"/></g>
<path d="M0 276 C180 250 300 262 440 276 S700 256 800 266 V340 H0Z" fill="#1D2A55"/>
<g fill="#16214A"><ellipse cx="120" cy="262" rx="26" ry="18"/><ellipse cx="146" cy="254" rx="20" ry="16"/><rect x="128" y="262" width="5" height="22"/><ellipse cx="710" cy="256" rx="24" ry="16"/><rect x="707" y="262" width="5" height="18"/></g>
