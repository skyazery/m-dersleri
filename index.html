<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0F1F">
<title>성경교재 · Müqəddəs Kitab dərsləri</title>
<link rel="stylesheet" href="fonts/pretendardvariable-dynamic-subset.css">
<style>
/* Üç görünüş: seçim (tünd) · uşaqlar = "Mənim yolum" (açıq, nişanlar) · yeniyetmələr = "Hər gün birlikdə" (tünd, ardıcıllıq) */
:root{
 --bg:#0A0F1F;--ink:#F3F5FB;--soft:#9AA6C3;--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.1);--edge:rgba(255,255,255,.12);--teal:#4FD1C5;--violet:#8B7CF6;--gold:#F6C766;
 --k-bg:#FFF8EC;--k-ink:#23324A;--k-soft:#6A5A3E;--k-line:#F0DFC0;--k-card:#FFFFFF;--k-accent:#1E5FD9;--k-sun:#FFD15C;--k-ok:#2E9C6A;--k-warm:#B5651D;
 --t-bg:#0E1424;--t-card:#161E33;--t-line:#263152;--t-chip:#1B2338;--t-ink:#EEF2FA;--t-soft:#9AA6C3;--t-mint:#7FE0D0;--t-hot:#FF8A4C;
 color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Segoe UI","Noto Sans KR",sans-serif;line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body.kid,html.kid{background:var(--k-bg);color-scheme:light}
body.teen,html.teen{background:var(--t-bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}

/* ---------- seçim ---------- */
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(40% 35% at 15% 8%,rgba(79,209,197,.28),transparent 70%),radial-gradient(45% 40% at 90% 20%,rgba(139,124,246,.30),transparent 70%),radial-gradient(50% 40% at 50% 100%,rgba(246,199,102,.12),transparent 70%)}
body.kid .glow,body.teen .glow{display:none}
#pick header{text-align:center;margin:16px 0 30px}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);padding:6px 12px;border:1px solid var(--edge);border-radius:999px;background:var(--glass)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}
#pick h1{margin:16px 0 6px;font-size:clamp(46px,14vw,72px);font-weight:900;letter-spacing:-.04em;line-height:1.05;background:linear-gradient(120deg,#fff 20%,var(--gold) 60%,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
#pick header p{margin:0;color:var(--soft);font-size:15px}
.group{margin:0 0 16px}
.group h2{margin:0 0 10px;font-size:12px;font-weight:800;color:var(--soft);letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.group h2::after{content:"";flex:1;height:1px;background:var(--edge)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns button{text-align:left;padding:16px;border-radius:20px;border:1px solid var(--edge);background:var(--glass);cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .15s,border-color .15s}
.btns button:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.25)}
.btns .em{font-size:26px;line-height:1}
.btns b{font-size:18px;font-weight:800}
.btns small{font-size:12px;color:var(--soft)}
footer{margin-top:40px;text-align:center;color:var(--soft);font-size:12px;letter-spacing:.06em}

/* ---------- ortaq ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.langs{display:flex;gap:4px;border-radius:999px;padding:4px}
.langs a{font-size:13px;font-weight:800;padding:7px 10px;border-radius:999px;text-decoration:none;min-width:36px;text-align:center}
.back{font-size:13px;font-weight:700;text-decoration:none;opacity:.8}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list a{display:flex;align-items:center;gap:12px;text-decoration:none;border-radius:16px;padding:8px 12px 8px 8px}
.list img{width:56px;height:42px;border-radius:10px;object-fit:cover;flex:none;background:#ddd}
.list .tt{flex:1;min-width:0;display:flex;flex-direction:column}
.list .tt b{font-size:15px;font-weight:800;line-height:1.3}
.list .tt small{font-size:12px}
.st{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h2{margin:0;font-size:16px;font-weight:900}

/* ---------- uşaqlar (A) ---------- */
#kid{color:var(--k-ink);display:flex;flex-direction:column;gap:20px}
#kid .hi small{display:block;font-size:14px;font-weight:700;color:var(--k-soft)}
#kid .hi b{font-size:28px;font-weight:900;line-height:1.1}
#kid .langs{background:var(--k-card);border:2px solid var(--k-line)}
#kid .langs a{color:var(--k-soft)}
#kid .langs a[aria-current]{background:var(--k-ink);color:#fff}
#kid .back{color:var(--k-soft)}
.ring{background:var(--k-accent);border-radius:26px;padding:20px;display:flex;gap:18px;align-items:center;color:#fff}
.ring .c{position:relative;width:108px;height:108px;flex:none}
.ring .c div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:32px;font-weight:900;line-height:1}
.ring .c span{font-size:12px;font-weight:800;opacity:.85}
.ring .tx{display:flex;flex-direction:column;gap:6px;min-width:0}
.ring .tx small{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.ring .tx b{font-size:19px;font-weight:900;line-height:1.25}
.ring .tx span{font-size:14px;font-weight:700;opacity:.92}
.next{background:var(--k-card);border-radius:22px;border:2px solid var(--k-line);overflow:hidden;display:flex;flex-direction:column}
.next img{width:100%;height:auto;aspect-ratio:16/8;object-fit:cover;display:block;max-width:100%}
.next .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.next small{font-size:13px;font-weight:800;color:var(--k-warm)}
.next h3{margin:0;font-size:21px;font-weight:900;line-height:1.25}
.go{align-self:flex-start;background:var(--k-ink);color:#fff;font-size:16px;font-weight:900;padding:12px 24px;border-radius:14px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.bd{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.bd i{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.bd i.off{border:2px dashed #D9C7A4}
.bd span{font-size:12px;font-weight:800;line-height:1.25}
.bd.off span{color:var(--k-soft);font-weight:700}
#kid .list a{background:var(--k-card);color:var(--k-ink);border:2px solid transparent}
#kid .list a.now{border-color:var(--k-accent)}
#kid .list small{color:var(--k-soft)}
#kid .now-t{font-size:12px;font-weight:900;color:var(--k-accent);flex:none}
.half{width:26px;height:26px;border-radius:50%;border:3px solid var(--k-sun);flex:none}

/* ---------- yeniyetmələr (C) ---------- */
#teen{color:var(--t-ink);display:flex;flex-direction:column;gap:18px}
#teen .hi{font-size:23px;font-weight:900;letter-spacing:-.01em;line-height:1.2}
.streak{display:flex;align-items:center;gap:6px;background:var(--t-chip);border-radius:999px;padding:7px 12px;font-weight:800;font-size:15px}
#teen .langs{background:var(--t-chip)}
#teen .langs a{color:var(--t-soft)}
#teen .langs a[aria-current]{background:var(--t-ink);color:var(--t-bg)}
#teen .back{color:var(--t-soft)}
.card{background:var(--t-card);border:1px solid var(--t-line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card .lbl{font-size:13px;font-weight:700;color:var(--t-soft)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.week div{display:flex;flex-direction:column;gap:6px;align-items:center}
.week span{font-size:12px;color:var(--t-soft)}
.week i{width:34px;height:34px;border-radius:50%;background:var(--t-line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:800;color:var(--t-ink)}
.week i.on{background:var(--t-hot)}
.week i.today{box-sizing:border-box;border:2px solid var(--t-hot);background:transparent}
.week i.today.on{background:var(--t-hot)}
.today-c{position:relative;border-radius:24px;overflow:hidden;min-height:300px;display:flex;background:#1a2238}
.today-c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.today-c .in{position:relative;margin-top:auto;width:100%;padding:18px;background:rgba(10,15,31,.88);display:flex;flex-direction:column;gap:8px}
.today-c small{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--t-mint)}
.today-c h3{margin:0;font-size:23px;font-weight:900;line-height:1.2}
.today-c .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.today-c .row span{font-size:13px;color:#C4CCE0}
.go2{background:var(--t-mint);color:var(--t-bg);font-size:15px;font-weight:900;padding:11px 20px;border-radius:12px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.mates{display:flex;align-items:center;gap:12px}
.av{display:flex;flex:none}
.av span{width:36px;height:36px;border-radius:50%;border:2px solid var(--t-card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--t-bg)}
.av span+span{margin-left:-10px}
.mates p{margin:0;font-size:14px;line-height:1.45;color:#C4CCE0}
.verse{background:var(--t-chip);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.verse p{margin:0;font-size:16px;line-height:1.55}
.verse span{font-size:13px;color:var(--t-soft)}
#teen .list a{background:var(--t-card);color:var(--t-ink)}
#teen .list a.now{box-shadow:0 0 0 1.5px var(--t-mint)}
#teen .list small{color:var(--t-soft)}
#teen .now-t{font-size:11px;font-weight:900;color:var(--t-mint);flex:none;letter-spacing:.06em}
#teen .half{border-color:var(--t-hot)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="wrap">

<div class="group"><h2>한국어</h2><div class="btns">

<div class="group"><h2>Русский</h2><div class="btns">

<div class="group"><h2>English</h2><div class="btns">

</div></div>
<footer>MATTANIN YAZDIĞI MÜJDƏ · 마태복음</footer>
</section>

<script>
const D={"az":[[1,"1:1–25","İmmanuel — Allah bizimlədir!"],[2,"2:1–12","Ulduzun ardınca gələn müdriklər"],[3,"2:13–23","Allahın qoruduğu körpə İsa"],[4,"3:1–17","Göydən gələn səs"],[5,"4:1–11","Kəlamla qalib gələn İsa"],[6,"4:12–25","Ardımca gəlin"],[7,"5:1–16","Dünyanın duzu və nuru"],[8,"5:17–48","Düşmənlərinizi sevin"],[9,"6:1–18","Göylərdə olan Atamız"],[10,"6:19–34","Narahat olmayın"],[11,"7:1–29","Qaya üzərində tikilən ev"],[12,"8:1–34","Küləklər və dəniz də itaət edir"],[13,"9:1–38","Günahkarları çağırmağa gəldi"],[14,"10:1–42","Siz sərçələrdən dəyərlisiniz"],[15,"11:1–30","Hamınız yanıma gəlin"],[16,"12:1–50","Şənbə gününün Rəbbi"],[17,"13:1–23","Toxum əkən adam"],[18,"13:24–58","Tarlada gizlədilmiş xəzinə"],[19,"14:1–36","Cəsarətli olun, Mənəm"],[20,"15:1–39","Ey qadın, imanın böyükdür"],[21,"16:1–28","Siz Məni kim hesab edirsiniz?"],[22,"17:1–27","Onu dinləyin"],[23,"18:1–35","İtmiş bir qoyun"],[24,"19:1–30","Qoyun uşaqlar yanıma gəlsin"],[25,"20:1–34","Xidmət etməyə gələn İsa"],[26,"21:1–22","Hosanna!"],[27,"21:23–22:46","Ən böyük əmr"],[28,"23:1–24:51","Ayıq olun"],[29,"25:1–46","Ən kiçik qardaşlarımdan birinə"],[30,"26:1–35","Son Şam yeməyi"],[31,"26:36–75","Sənin istədiyin kimi olsun"],[32,"27:1–66","Çarmıx"],[33,"28:1–20","O dirildi!"]],"az-genc":[[1,"1:1–25","Bizimlə olan Allah",["“Məryəm bir oğul doğacaq. Onun adını İsa qoy. Çünki O, Öz xalqını günahlarından xilas edəcək.”","Matta 1:21"]],[2,"2:1–12","Əsl Padşah kimdir?",["“Onlar evə girib körpəni anası Məryəmlə birlikdə gördülər, yerə əyilib Ona səcdə etdilər, xəzinələrini açıb Ona hədiyyələr verdilər.”","2:11"]],[3,"2:13–23","Qaçqın olan Padşah",["“Yusif qalxıb körpəni və anasını götürdü və gecə ikən Misirə yola düşdü.”","2:14"]],[4,"3:1–17","Tövbə və açılan göylər",["“Göydən bir səs gəldi: ‘Bu Mənim sevimli Oğlumdur, Ondan razıyam.’”","3:17"]],[5,"4:1–11","Səhrada qalib gələn Oğul",["“İnsan yalnız çörəklə deyil, Allahın ağzından çıxan hər sözlə yaşayar.”","4:4"]],[6,"4:12–25","Torları buraxıb",["“Ardımca gəlin, sizi insan balıqçıları edəcəyəm.” Onlar dərhal torlarını buraxıb Onun ardınca getdilər.","4:19–20"]],[7,"5:1–16","Tərsinə çevrilmiş xoşbəxtlik",["“Qoy sizin nurunuz insanların qarşısında elə parlasın ki, yaxşı əməllərinizi görüb göylərdə olan Atanızı izzətləndirsinlər.”","5:16"]],[8,"5:17–48","Daha dərin salehlik",["“Mən isə sizə deyirəm: düşmənlərinizi sevin, sizi təqib edənlər üçün dua edin ki, göylərdə olan Atanızın övladları olasınız.”","5:44–45"]],[9,"6:1–18","Ataya dua",["“Sən dua edəndə öz otağına gir, qapını bağla və gizlində olan Atana dua et. Gizlində olanı görən Atan sənin əvəzini verəcək.”","6:6"]],[10,"6:19–34","Əvvəlcə nəyi axtarmalı",["“Amma siz əvvəlcə Allahın Padşahlığını və Onun salehliyini axtarın, bütün bunlar da sizə əlavə olaraq veriləcək. Buna görə sabahkı gün üçün qayğı çəkməyin.”","6:33–34"]],[11,"7:1–29","Eşidib əməl edən",["“Bu sözlərimi eşidib onlara əməl edən hər kəs evini qaya üzərində tikən ağıllı adama bənzəyir.”","7:24"]],[12,"8:1–34","Sözün səlahiyyəti",["“Yüzbaşı cavab verdi: “Ya Rəbb, mən layiq deyiləm ki, evimə gələsən. Ancaq yalnız bir söz de, xidmətçim sağalacaq.””","8:8"]],[13,"9:1–38","Həkimə ehtiyacı olanlar",["“Həkim sağlamlara deyil, xəstələrə lazımdır. … Mən salehləri deyil, günahkarları çağırmağa gəldim.”","9:12–13"]],[14,"10:1–42","Göndərilənlər",["“İki sərçə bir assariona satılmırmı? Amma Atanızın izni olmadan onlardan biri belə yerə düşməz. Hətta başınızdakı saçların hamısı sayılıb. Buna görə də qorxmayın, siz çoxlu sərçədən daha dəyərlisiniz.”","10:29–31"]],[15,"11:1–30","Rahatlıq verən",["“Ey bütün yorğunlar və ağır yük daşıyanlar, Mənim yanıma gəlin, Mən sizə rahatlıq verəcəyəm. Boyunduruğumu götürün və Məndən öyrənin, çünki Mən həlim və təvazökar ürəkliyəm. Beləcə canınıza rahatlıq taparsınız.”","11:28–29"]],[16,"12:1–50","Şənbə gününün Rəbbi",["“Ədaləti qələbəyə çatdırana qədər əzilmiş qamışı qırmayacaq, sönməkdə olan fitili söndürməyəcək. Millətlər Onun adına ümid bağlayacaq.”","12:20–21"]],[17,"13:1–23","Dörd ürək torpağı",["“Yaxşı torpağa səpilən isə Kəlamı eşidib anlayan adamdır. O, bəhrə verir: biri yüz, biri altmış, biri də otuz qat.”","13:23"]],[18,"13:24–58","Hər şeyə dəyən Padşahlıq",["“Səmavi Padşahlıq tarlada gizlədilmiş xəzinəyə bənzəyir. Bir adam onu tapıb yenə gizlədir və sevinərək gedib varını satır və o tarlanı alır.”","13:44"]],[19,"14:1–36","Küləyə deyil, İsaya",["“İsa dərhal əlini uzadıb onu tutdu və dedi: “Ey kiçik imanlı, niyə şübhə etdin?” … Qayıqda olanlar Ona səcdə edib dedilər: “Sən həqiqətən Allahın Oğlusan.””","14:31–33"]],[20,"15:1–39","Qırıntı da bəsdir",["“Qadın dedi: “Bəli, ya Rəbb, amma itlər də sahiblərinin süfrəsindən düşən qırıntıları yeyir.” Onda İsa ona cavab verdi: “Ey qadın, imanın böyükdür! Qoy istədiyin kimi olsun.” Həmin saat qızı sağaldı.”","15:27–28"]],[21,"16:1–28","Qaya üzərində etiraf",["“İsa onlardan soruşdu: “Bəs siz Məni kim hesab edirsiniz?” Simon Peter cavab verdi: “Sən Məsihsən, var olan Allahın Oğlusan.””","16:15–16"]],[22,"17:1–27","Dağda izzət, dağın ətəyində gerçəklik",["“Peter hələ danışarkən parlaq bir bulud onları örtdü və buluddan bir səs gəldi: “Bu Mənim sevimli Oğlumdur, Ondan razıyam. Onu dinləyin!””","17:5"]],[23,"18:1–35","Kiçiklərin və bağışlamanın cəmiyyəti",["“Onda Peter İsaya yaxınlaşıb dedi: “Ya Rəbb, qardaşım mənə qarşı günah edərsə, neçə dəfə onu bağışlamalıyam? Yeddi dəfəmi?” İsa ona dedi: “Sənə deyirəm: yeddi dəfə yox, yetmiş dəfə yeddi dəfə.””","18:21–22"]],[24,"19:1–30","Daha nəyim çatışmır?",["“İsa onlara baxıb dedi: “İnsan üçün bu mümkün deyil, amma Allah üçün hər şey mümkündür.””","19:26"]],[25,"20:1–34","Lütfün hesabı",["“Aranızda böyük olmaq istəyən sizə xidmət edən olsun … Necə ki Bəşər Oğlu da xidmət olunmağa deyil, xidmət etməyə və canını çoxları üçün fidyə verməyə gəldi.”","20:26–28"]],[26,"21:1–22","Hansı Padşahı qarşılayırıq?",["“Sion qızına deyin: “Budur, Padşahın sənə gəlir; O, həlimdir, eşşəyə, yük heyvanının balasına minib.””","21:5"]],[27,"21:23–22:46","Suallara cavab verən İsa",["“İsa ona dedi: “Allahın Rəbbi bütün ürəyinlə, bütün canınla və bütün düşüncənlə sev. Bu, ən böyük və birinci əmrdir. İkincisi də buna bənzəyir: qonşunu özün kimi sev.””","22:37–39"]],[28,"23:1–24:51","Təvazökarlıq və ayıqlıq",["“Buna görə ayıq olun, çünki Rəbbinizin hansı gün gələcəyini bilmirsiniz. … Siz də hazır olun, çünki Bəşər Oğlu gözləmədiyiniz saatda gələcək.”","24:42, 44"]],[29,"25:1–46","Gözləmə nə ilə doldurulur?",["“Padşah onlara cavab verəcək: “Sizə doğrusunu deyirəm: bu ən kiçik qardaşlarımdan birinə nə etdinizsə, Mənə etmiş oldunuz.””","25:40"]],[30,"26:1–35","Ətir və otuz gümüş",["“Bu, Mənim əhd qanımdır. O, günahların bağışlanması üçün çoxlarının uğrunda tökülür.”","26:28"]],[31,"26:36–75","Ən qaranlıq gecə",["“Bir az irəli gedib üzüstə yerə qapanaraq dua edib dedi: “Atam, mümkünsə, bu kasa Məndən uzaq olsun. Amma Mənim istədiyim kimi yox, Sənin istədiyin kimi olsun.””","26:39"]],[32,"27:1–66","Həqiqətən, Allahın Oğlu",["“Yüzbaşı və onunla birlikdə İsanı keşikləyənlər zəlzələni və baş verənləri görəndə çox qorxub dedilər: “Həqiqətən, bu, Allahın Oğlu idi!””","27:54"]],[33,"28:1–20","Sondan başlanğıca",["“Buna görə gedin, bütün millətləri şagird hazırlayın. Onları Ata, Oğul və Müqəddəs Ruhun adı ilə vəftiz edin, sizə əmr etdiyim hər şeyə əməl etməyi onlara öyrədin. Budur, Mən dünyanın sonunadək hər zaman sizinləyəm.”","28:19–20"]]],"ko-usaq":[[1,"1:1–25","임마누엘, 하나님이 우리와 함께 계셔요"],[2,"2:1–12","별을 따라온 동방박사"],[3,"2:13–23","하나님이 지켜 주신 아기 예수님"],[4,"3:1–17","하늘에서 들린 목소리"],[5,"4:1–11","말씀으로 이기신 예수님"],[6,"4:12–25","나를 따라오너라"],[7,"5:1–16","세상의 소금과 빛"],[8,"5:17–48","원수를 사랑하라"],[9,"6:1–18","하늘에 계신 우리 아버지"],[10,"6:19–34","걱정하지 마세요"],[11,"7:1–29","반석 위에 지은 집"],[12,"8:1–34","바람과 바다도 순종해요"],[13,"9:1–38","죄인을 부르러 오셨어요"],[14,"10:1–42","너희는 참새보다 귀해요"],[15,"11:1–30","다 내게로 오라"],[16,"12:1–50","안식일의 주인"],[17,"13:1–23","씨 뿌리는 사람"],[18,"13:24–58","밭에 감추인 보물"],[19,"14:1–36","안심하라, 나다"],[20,"15:1–39","여자여, 네 믿음이 크도다"],[21,"16:1–28","너는 나를 누구라 하느냐"],[22,"17:1–27","그의 말을 들으라"],[23,"18:1–35","잃은 양 한 마리"],[24,"19:1–30","어린아이들을 내게 오게 하라"],[25,"20:1–34","섬기러 오신 예수님"],[26,"21:1–22","호산나!"],[27,"21:23–22:46","가장 큰 계명"],[28,"23:1–24:51","깨어 있으라"],[29,"25:1–46","지극히 작은 자 하나에게"],[30,"26:1–35","마지막 만찬"],[31,"26:36–75","아버지의 원대로"],[32,"27:1–66","십자가"],[33,"28:1–20","살아나셨어요!"]],"ko-genc":[[1,"1:1–25","함께 계시는 하나님",null],[2,"2:1–12","누가 진짜 왕인가",["“그들은 집에 들어가 아기와 어머니 마리아를 보고, 엎드려 아기께 경배하고 보물 상자를 열어 예물을 드렸다.”","2:11"]],[3,"2:13–23","피난민이 되신 왕",["“요셉은 일어나 밤에 아기와 그의 어머니를 데리고 이집트로 떠났다.”","2:14"]],[4,"3:1–17","회개와 열린 하늘",["“그리고 하늘에서 소리가 들렸다. ‘이는 내 사랑하는 아들이요, 내가 기뻐하는 자다.’”","3:17"]],[5,"4:1–11","광야에서 이기신 아들",["“사람이 빵으로만 사는 것이 아니라 하나님의 입에서 나오는 모든 말씀으로 산다.”","4:4"]],[6,"4:12–25","그물을 버려두고",["“나를 따라오너라. 내가 너희를 사람을 낚는 어부가 되게 하겠다.” 그들은 곧 그물을 버려두고 예수님을 따랐다.","4:19–20"]],[7,"5:1–16","거꾸로 된 행복",["“이같이 너희 빛이 사람 앞에 비치게 하여, 그들이 너희 착한 행실을 보고 하늘에 계신 너희 아버지께 영광을 돌리게 하라.”","5:16"]],[8,"5:17–48","더 깊은 의",["“나는 너희에게 이르노니 너희 원수를 사랑하며 너희를 박해하는 자를 위하여 기도하라. 이것이 하늘에 계신 너희 아버지의 아들이 되리니.”","5:44–45"]],[9,"6:1–18","아버지께 드리는 기도",["“너는 기도할 때에 네 골방에 들어가 문을 닫고 은밀한 중에 계신 네 아버지께 기도하라. 은밀한 중에 보시는 네 아버지께서 갚으시리라.”","6:6"]],[10,"6:19–34","먼저 구할 것",["“그런즉 너희는 먼저 그의 나라와 그의 의를 구하라. 그리하면 이 모든 것을 너희에게 더하시리라. 그러므로 내일 일을 위하여 염려하지 말라.”","6:33–34"]],[11,"7:1–29","듣고 행하는 사람",["“그러므로 누구든지 나의 이 말을 듣고 행하는 자는 그 집을 반석 위에 지은 지혜로운 사람 같으리니.”","7:24"]],[12,"8:1–34","말씀의 권위",["“백부장이 대답하여 이르되 주여 내 집에 들어오심을 나는 감당하지 못하겠사오니 다만 말씀으로만 하옵소서. 그러면 내 하인이 낫겠사옵나이다.”","8:8"]],[13,"9:1–38","의사가 필요한 사람",["“건강한 자에게는 의사가 쓸 데 없고 병든 자에게라야 쓸 데 있느니라. … 나는 의인을 부르러 온 것이 아니요 죄인을 부르러 왔노라.”","9:12–13"]],[14,"10:1–42","보냄받은 사람들",["“참새 두 마리가 한 앗사리온에 팔리지 않느냐. 그러나 너희 아버지께서 허락하지 아니하시면 그 하나도 땅에 떨어지지 아니하리라. 너희에게는 머리털까지 다 세신 바 되었나니 두려워하지 말라. 너희는 많은 참새보다 귀하니라.”","10:29–31"]],[15,"11:1–30","쉼을 주시는 분",["“수고하고 무거운 짐 진 자들아 다 내게로 오라. 내가 너희를 쉬게 하리라. 나는 마음이 온유하고 겸손하니 나의 멍에를 메고 내게 배우라. 그리하면 너희 마음이 쉼을 얻으리니.”","11:28–29"]],[16,"12:1–50","안식일의 주인",["“상한 갈대를 꺾지 아니하며 꺼져 가는 심지를 끄지 아니하기를 심판하여 이길 때까지 하리니, 또한 이방들이 그의 이름을 바라리라.”","12:20–21"]],[17,"13:1–23","네 가지 마음밭",["“좋은 땅에 뿌려졌다는 것은 말씀을 듣고 깨닫는 자니 결실하여 어떤 것은 백 배, 어떤 것은 육십 배, 어떤 것은 삼십 배가 되느니라.”","13:23"]],[18,"13:24–58","모든 것을 걸 만한 나라",["“천국은 마치 밭에 감추인 보화와 같으니 사람이 이를 발견한 후 숨겨 두고 기뻐하며 돌아가서 자기의 소유를 다 팔아 그 밭을 사느니라.”","13:44"]],[19,"14:1–36","바람이 아니라 예수님을",["“예수께서 즉시 손을 내밀어 그를 붙잡으시며 이르시되 믿음이 작은 자여 왜 의심하였느냐 하시고 … 배에 있는 사람들이 예수께 절하며 이르되 진실로 하나님의 아들이로소이다 하더라.”","14:31–33"]],[20,"15:1–39","부스러기라도 좋습니다",["“여자가 말하되 주여 옳소이다마는 개들도 제 주인의 상에서 떨어지는 부스러기를 먹나이다 하니, 이에 예수께서 대답하여 이르시되 여자여 네 믿음이 크도다. 네 소원대로 되리라 하시니 그 때로부터 그의 딸이 나으니라.”","15:27–28"]],[21,"16:1–28","반석 위의 고백",["“이르시되 너희는 나를 누구라 하느냐. 시몬 베드로가 대답하여 이르되 주는 그리스도시요 살아 계신 하나님의 아들이시니이다.”","16:15–16"]],[22,"17:1–27","산 위의 영광, 산 아래의 현실",["“말할 때에 홀연히 빛난 구름이 그들을 덮으며 구름 속에서 소리가 나서 이르시되 이는 내 사랑하는 아들이요 내가 기뻐하는 자니 너희는 그의 말을 들으라 하시는지라.”","17:5"]],[23,"18:1–35","작은 자와 용서의 공동체",["“베드로가 나아와 이르되 주여 형제가 내게 죄를 범하면 몇 번이나 용서하여 주리이까 일곱 번까지 하오리이까. 예수께서 이르시되 네게 이르노니 일곱 번뿐 아니라 일곱 번을 일흔 번까지라도 할지니라.”","18:21–22"]],[24,"19:1–30","무엇이 부족합니까?",["“예수께서 그들을 보시며 이르시되 사람으로는 할 수 없으나 하나님으로서는 다 하실 수 있느니라.”","19:26"]],[25,"20:1–34","은혜의 계산법",["“너희 중에 누구든지 크고자 하는 자는 너희를 섬기는 자가 되고 … 인자가 온 것은 섬김을 받으려 함이 아니라 도리어 섬기려 하고 자기 목숨을 많은 사람의 대속물로 주려 함이니라.”","20:26–28"]],[26,"21:1–22","어떤 왕을 맞이하는가",["“시온 딸에게 이르기를 네 왕이 네게 임하나니 그는 겸손하여 나귀, 곧 멍에 메는 짐승의 새끼를 탔도다 하라 하였느니라.”","21:5"]],[27,"21:23–22:46","질문에 답하신 예수님",["“예수께서 이르시되 네 마음을 다하고 목숨을 다하고 뜻을 다하여 주 너의 하나님을 사랑하라 하셨으니 이것이 크고 첫째 되는 계명이요 둘째도 그와 같으니 네 이웃을 네 자신 같이 사랑하라 하셨으니.”","22:37–39"]],[28,"23:1–24:51","겸손과 깨어 있음",["“그러므로 깨어 있으라. 어느 날에 너희 주가 임할는지 너희가 알지 못함이니라. … 이러므로 너희도 준비하고 있으라. 생각하지 않은 때에 인자가 오리라.”","24:42, 44"]],[29,"25:1–46","기다림은 무엇으로 채워지는가",["“임금이 대답하여 이르시되 내가 진실로 너희에게 이르노니 너희가 여기 내 형제 중에 지극히 작은 자 하나에게 한 것이 곧 내게 한 것이니라 하시고.”","25:40"]],[30,"26:1–35","향유와 은 삼십",["“이것은 죄 사함을 얻게 하려고 많은 사람을 위하여 흘리는 바 나의 피 곧 언약의 피니라.”","26:28"]],[31,"26:36–75","가장 어두운 밤",["“조금 나아가사 얼굴을 땅에 대시고 엎드려 기도하여 이르시되 내 아버지여 만일 할 만하시거든 이 잔을 내게서 지나가게 하옵소서 그러나 나의 원대로 마시옵고 아버지의 원대로 하옵소서 하시고.”","26:39"]],[32,"27:1–66","진실로 하나님의 아들",["“백부장과 및 함께 예수를 지키던 자들이 지진과 그 일어나는 일들을 보고 심히 두려워하여 이르되 이는 진실로 하나님의 아들이었도다 하더라.”","27:54"]],[33,"28:1–20","끝에서 시작으로",["“그러므로 너희는 가서 모든 민족을 제자로 삼아 아버지와 아들과 성령의 이름으로 세례를 베풀고 내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라. 볼지어다 내가 세상 끝날까지 너희와 항상 함께 있으리라 하시니라.”","28:19–20"]]],"ru":[[1,"1:1–25","Иммануил — Бог с нами!"],[2,"2:1–12","Мудрецы, идущие за звездой"],[3,"2:13–23","Младенец Иисус, хранимый Богом"],[4,"3:1–17","Голос с неба"],[5,"4:1–11","Иисус побеждает Словом"],[6,"4:12–25","Идите за Мной"],[7,"5:1–16","Соль и свет мира"],[8,"5:17–48","Любите врагов ваших"],[9,"6:1–18","Наш Небесный Отец"],[10,"6:19–34","Не переживай"],[11,"7:1–29","Дом, построенный на камне"],[12,"8:1–34","Даже ветры и море повинуются"],[13,"9:1–38","Пришёл призвать грешников"],[14,"10:1–42","Вы ценнее воробьёв"],[15,"11:1–30","Придите ко Мне все"],[16,"12:1–50","Господин субботы"],[17,"13:1–23","Сеятель"],[18,"13:24–58","Сокровище, скрытое на поле"],[19,"14:1–36","Ободритесь, это Я"],[20,"15:1–39","О женщина, велика вера твоя"],[21,"16:1–28","За кого вы почитаете Меня?"],[22,"17:1–27","Слушайте Его"],[23,"18:1–35","Потерянная овца"],[24,"19:1–30","Пустите детей приходить ко Мне"],[25,"20:1–34","Иисус, пришедший служить"],[26,"21:1–22","Осанна!"],[27,"21:23–22:46","Самая большая заповедь"],[28,"23:1–24:51","Бодрствуйте"],[29,"25:1–46","Одному из сих братьев Моих меньших"],[30,"26:1–35","Тайная вечеря"],[31,"26:36–75","Пусть будет, как Ты хочешь"],[32,"27:1–66","Крест"],[33,"28:1–20","Он воскрес!"]],"ru-genc":[[1,"1:1–25","Бог с нами",["«родит же Сына, и наречёшь Ему имя Иисус, ибо Он спасёт людей Своих от грехов их».","Матфей 1:21"]],[2,"2:1–12","Кто истинный Царь?",["«И, войдя в дом, увидели Младенца с Мариею, Матерью Его, и, пав, поклонились Ему; и, открыв сокровища свои, принесли Ему дары: золото, ладан и смирну».","2:11"]],[3,"2:13–23","Царь, ставший беженцем",["«Он встал, взял Младенца и Матерь Его ночью и пошел в Египет».","2:14"]],[4,"3:1–17","Покаяние и открытые небеса",["«И голос с неба сказал: Сей есть Сын Мой возлюбленный, в Котором Моё благоволение».","3:17"]],[5,"4:1–11","Сын, победивший в пустыне",["«Не одним хлебом живёт человек, но всяким словом, исходящим из уст Божьих».","4:4"]],[6,"4:12–25","Оставив сети",["«Идите за Мной, и Я сделаю вас ловцами человеков». И они тотчас, оставив сети, последовали за Ним.","4:19–20"]],[7,"5:1–16","Перевёрнутое счастье",["«Так да светит свет ваш пред людьми, чтобы они видели ваши добрые дела и прославляли Отца вашего Небесного».","5:16"]],[8,"5:17–48","Более глубокая праведность",["«А Я говорю вам: любите врагов ваших, благословляйте проклинающих вас, благотворите ненавидящим вас и молитесь за обижающих вас и гонящих вас, да будете сынами Отца вашего Небесного.»","5:44–45"]],[9,"6:1–18","Молитва Отцу",["«Ты же, когда молишься, войди в комнату твою и, затворив дверь твою, помолись Отцу твоему, Который втайне; и Отец твой, видящий тайное, воздаст тебе явно».","6:6"]],[10,"6:19–34","Что искать прежде всего",["«Ищите же прежде Царства Божия и правды Его, и это все приложится вам. Итак не заботьтесь о завтрашнем дне».","6:33–34"]],[11,"7:1–29","Слушающий и исполняющий",["«Итак всякого, кто слушает слова Мои сии и исполняет их, уподоблю мужу благоразумному, который построил дом свой на камне».","7:24"]],[12,"8:1–34","Власть слова",["«Сотник же, отвечая, сказал: Господи! я недостоин, чтобы Ты вошёл под кров мой, но скажи только слово, и выздоровеет слуга мой».","8:8"]],[13,"9:1–38","Те, кто нуждается во враче",["«Не здоровые имеют нужду во враче, но больные. … Я пришел призвать не праведников, но грешников к покаянию».","9:12–13"]],[14,"10:1–42","Посланные",["«Не две ли малые птицы продаются за ассарий? И ни одна из них не упадёт на землю без воли Отца вашего. А у вас даже все волосы на голове сосчитаны. Поэтому не бойтесь: вы ценнее многих воробьёв».","10:29–31"]],[15,"11:1–30","Дающий покой",["«Придите ко Мне все труждающиеся и обремененные, и Я успокою вас; возьмите иго Мое на себя и научитесь от Меня, ибо Я кроток и смирен сердцем, и найдете покой душам вашим».","11:28–29"]],[16,"12:1–50","Господин субботы",["«Трости надломленной не переломит, и льна курящегося не угасит, доколе не доставит суду победы; и на имя Его будут уповать народы».","12:20–21"]],[17,"13:1–23","Четыре почвы сердца",["«Посеянное же на доброй земле означает слышащего слово и разумеющего, который и бывает плодоносен, так что иной приносит плод во сто крат, иной в шестьдесят, а иной в тридцать».","13:23"]],[18,"13:24–58","Царство, стоящее всего",["«Царство Небесное подобно сокровищу, скрытому на поле, которое, найдя, человек утаил, и от радости о нём идёт и продаёт всё, что имеет, и покупает поле то».","13:44"]],[19,"14:1–36","На Иисуса, а не на ветер",["«Иисус тотчас простёр руку, поддержал его и говорит ему: маловерный! зачем ты усомнился? … Бывшие же в лодке подошли, поклонились Ему и сказали: истинно Ты Сын Божий».","14:31–33"]],[20,"15:1–39","Достаточно и крошек",["Она сказала: так, Господи! но и псы едят крохи, которые падают со стола господ их. Тогда Иисус сказал ей в ответ: о, женщина! велика вера твоя; да будет тебе по желанию твоему. И исцелилась дочь её в тот час.","15:27–28"]],[21,"16:1–28","Исповедание на скале",["«Он говорит им: а вы за кого почитаете Меня? Симон же Пётр, отвечая, сказал: Ты — Христос, Сын Бога живого.»","16:15–16"]],[22,"17:1–27","Слава на горе, реальность у подножия",["«Когда он еще говорил, се, облако светлое осенило их; и се, глас из облака глаголющий: Сей есть Сын Мой Возлюбленный, в Котором Мое благоволение; Его слушайте».","17:5"]],[23,"18:1–35","Община малых и прощение",["«Тогда Петр приступил к Нему и сказал: Господи! сколько раз прощать брату моему, согрешающему против меня? до семи ли раз? Иисус говорит ему: не говорю тебе: до семи раз, но до седмижды семидесяти раз».","18:21–22"]],[24,"19:1–30","Чего ещё недостаёт мне?",["«А Иисус, воззрев, сказал им: человекам это невозможно, Богу же всё возможно».","19:26"]],[25,"20:1–34","Счёт благодати",["«Кто хочет между вами быть большим, да будет вам слугою … так как Сын Человеческий не для того пришёл, чтобы Ему служили, но чтобы послужить и отдать душу Свою для искупления многих».","20:26–28"]],[26,"21:1–22","Какого Царя мы встречаем?",["«Скажите дщери Сионовой: се, Царь твой грядет к тебе кроткий, сидящий на ослице и молодом осле, сыне подъяремной».","21:5"]],[27,"21:23–22:46","Иисус отвечает на вопросы",["«Иисус сказал ему: возлюби Господа Бога твоего всем сердцем твоим и всею душою твоею и всем разумением твоим: сия есть первая и наибольшая заповедь; вторая же подобна ей: возлюби ближнего твоего, как самого себя».","22:37–39"]],[28,"23:1–24:51","Смирение и бодрствование",["«Итак бодрствуйте, потому что не знаете, в который час Господь ваш приидет. … Потому и вы будьте готовы, ибо в который час не думаете, приидет Сын Человеческий».","24:42, 44"]],[29,"25:1–46","Чем наполняется ожидание?",["«И Царь скажет им в ответ: истинно говорю вам: так как вы сделали это одному из сих братьев Моих меньших, то сделали Мне».","25:40"]],[30,"26:1–35","Миро и тридцать сребреников",["«Ибо сие есть Кровь Моя Нового завета, за многих изливаемая во оставление грехов».","26:28"]],[31,"26:36–75","Самая тёмная ночь",["«И, отойдя немного, пал на лице Свое, молился и говорил: Отче Мой! если возможно, да минует Меня чаша сия; впрочем не как Я хочу, но как Ты».","26:39"]],[32,"27:1–66","Воистину Сын Божий",["«Сотник же и те, которые с ним стерегли Иисуса, видя землетрясение и все бывшее, устрашились весьма и говорили: воистину Он был Сын Божий».","27:54"]],[33,"28:1–20","От конца к началу",["«Итак, идите, научите все народы, крестя их во имя Отца и Сына и Святого Духа, уча их соблюдать всё, что Я повелел вам; и се, Я с вами во все дни до скончания века».","28:19–20"]]],"en":[[1,"1:1–25","Immanuel — God is with us!"],[2,"2:1–12","The Wise Men Follow the Star"],[3,"2:13–23","Baby Jesus Protected by God"],[4,"3:1–17","A Voice from Heaven"],[5,"4:1–11","Jesus Overcomes with the Word"],[6,"4:12–25","Follow Me"],[7,"5:1–16","The salt and light of the world"],[8,"5:17–48","Love Your Enemies"],[9,"6:1–18","Our Father in Heaven"],[10,"6:19–34","Do not worry"],[11,"7:1–29","The House Built on the Rock"],[12,"8:1–34","Even the winds and the sea obey"],[13,"9:1–38","He Came to Call Sinners"],[14,"10:1–42","You are more valuable than sparrows"],[15,"11:1–30","Come to Me, All of You"],[16,"12:1–50","Lord of the Sabbath"],[17,"13:1–23","The Farmer Who Planted Seeds"],[18,"13:24–58","Treasure Hidden in a Field"],[19,"14:1–36","Cheer up, it is I"],[20,"15:1–39","Woman, you have great faith"],[21,"16:1–28","Who do you say I am?"],[22,"17:1–27","Listen to Him"],[23,"18:1–35","A Lost Sheep"],[24,"19:1–30","Let the children come to me"],[25,"20:1–34","Jesus, Who Came to Serve"],[26,"21:1–22","Hosanna!"],[27,"21:23–22:46","The Greatest Commandment"],[28,"23:1–24:51","Stay Awake"],[29,"25:1–46","To one of the least of these my brothers"],[30,"26:1–35","The Last Supper"],[31,"26:36–75","Not as I will, but as you will"],[32,"27:1–66","The Cross"],[33,"28:1–20","He is risen!"]],"en-genc":[[1,"1:1–25","God with us",["“She will bring forth a son, and you shall call his name Jesus, for it is he who will save his people from their sins.”","Matthew 1:21"]],[2,"2:1–12","Who is the True King?",["“They came into the house and saw the young child with Mary his mother, and they fell down and worshiped Him. Opening their treasures, they offered Him gifts.”","2:11"]],[3,"2:13–23","The Refugee King",["“He arose and took the young child and his mother by night, and departed into Egypt.”","2:14"]],[4,"3:1–17","Repentance and the Opened Heavens",["“And a voice came out of the heavens, saying, ‘This is my beloved Son, with whom I am well pleased.’”","3:17"]],[5,"4:1–11","The Son Who Overcame in the Wilderness",["“Man shall not live by bread alone, but by every word that proceeds out of the mouth of God.”","4:4"]],[6,"4:12–25","Leaving the Nets",["“Follow Me, and I will make you fishers of men.” They immediately left their nets and followed function lsKeys(){const o=[];try{for(let i=0;i<localStorage.length;i++)o.push(localStorage.key(i))}catch(e){}return o}

if(/^[a-z0-9-]{1,20}$/.test(mc))ls('mders-m',mc);else mc=(ls('mders-m')||'');

function stats(k){
  const lang=k.slice(0,2), sfx='|'+ad;
  const did=n=>lang==='az'?'matta-'+pad(n):'matta-'+pad(n)+'-'+lang;
  const st={}, days=new Set(); let verses=0, perfect=0;
  for(const r of D[k]){
    const id=did(r[0]);
    const p=parseInt(ls('mders-proq-'+id+sfx)||'0',10), t=ls('mders-test-'+id+sfx), v=!!ls('mders-ayə-'+id+sfx);
    if(v)verses++;
    if(t){const m=t.split('/');if(m[0]===m[1])perfect++;}
    st[r[0]]={done:p>=100||!!t,started:p>0};
  }
  if(ad)for(const key of lsKeys()){
    const m=/^mders-gun-.+-(\d{4})-(\d{1,2})-(\d{1,2})\|(.*)$/.exec(key||'');
    if(m&&m[4]===ad)days.add(m[1]+'-'+(+m[2])+'-'+(+m[3]));
  }
  const dk=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  const today=new Date();today.setHours(12,0,0,0);
  let streak=0;const c=new Date(today);
  if(!days.has(dk(c)))c.setDate(c.getDate()-1);
  while(days.has(dk(c))){streak++;c.setDate(c.getDate()-1);}
  let best=0,run=0;const all=[...days].map(s=>{const[a,b,d]=s.split('-');return new Date(+a,+b-1,+d,12)}).sort((x,y)=>x-y);
  all.forEach((d,i)=>{run=i&&Math.round((d-all[i-1])/864e5)===1?run+1:1;if(run>best)best=run;});
  const done=Object.values(st).filter(x=>x.done).length;
  const nextRow=D[k].find(r=>!st[r[0]].done)||null;
  return {st,done,verses,perfect,streak,best,days,dk,today,nextRow,did};
}

}

function renderTeen(k){
  const u=U[k.slice(0,2)],S=stats(k),R=S.nextRow||D[k][D[k].length-1];
  const mon=new Date(S.today);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  let week='';for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const on=S.days.has(S.dk(d)),td=S.dk(d)===S.dk(S.today);
    week+=`<div><span${td?' style="color:var(--t-ink);font-weight:800"':''}>${u.days[i]}</span><i class="${on?'on':''}${td?' today':''}">${td&&!on?esc(u.today):''}</i></div>`;}
  const v=R[3];
  document.getElementById('teen').innerHTML=`
  <div class="top"><span class="hi">${ad?u.hi+', '+esc(ad):u.guest}</span><span class="streak" title="${esc(u.streak(S.streak))}">${svg('flame','#FF8A4C',18,2.2)}${u.streak(S.streak)}</span></div>
  ${langBar(k,TEEN)}
  <div class="card"><span class="lbl">${u.week}</span><div class="week">${week}</div></div>
  <div class="today-c"><img src="img/th/md-${pad(R[0])}.jpg" alt=""><div class="in"><small>${S.nextRow?u.todayLesson:u.again} · ${R[0]}</small><h3>${esc(R[2])}</h3><div class="row"><span>${u.book} ${esc(R[1])} · ${S.done} ${u.of}</span><a class="go2" href="matta-${pad(R[0])}-${k}/${tail}">${S.st[R[0]].started?u.cont:u.start}</a></div></div></div>
  <div class="card" id="mates" hidden></div>
  ${v?`<div class="sec"><h2>${u.verse}</h2><div class="verse"><p>${esc(v[0])}</p><span>${/^\d/.test(v[1]||'1')?u.book+' ':''}${esc(v[1]||R[1])}</span></div></div>`:''}
  <div class="sec"><h2>${u.lessons}</h2>${lessonList(k,S,u)}</div>
  <a class="back" href="#" data-pick>← ${u.change}</a>`;
  // sinif yoldaşları (cədvəldən; olmasa kart görünmür)
  const id=S.did(R[0]);
  fetch(ENDPOINT+'?bitirib='+id+'&sinif=genc'+(mc?'&m='+mc:'')).then(r=>r.json()).then(d=>{
    if(!d||!(d.n>0))return;const box=document.getElementById('mates');if(!box)return;
    const cols=['#8B7CF6','#F6C766','#4FD1C5','#FF8A4C'];
    box.innerHTML=`<span class="lbl" style="color:var(--t-ink);font-size:16px;font-weight:800">${u.mates}</span><div class="mates"><div class="av">${(d.h||[]).map((h,i)=>`<span style="background:${cols[i%4]}">${esc(h)}</span>`).join('')}${d.n>4?`<span style="background:var(--t-line);color:var(--t-ink);font-size:12px">+${d.n-4}</span>`:''}</div><p>${u.matesMsg(d.n)}</p></div>`;
    box.hidden=false;
  }).catch(()=>{});
}

function show(k,save){
  const teen=/genc$/.test(k), body=document.body, html=document.documentElement;
  body.className=html.className=teen?'teen':'kid';
  html.lang=k.slice(0,2);
  document.getElementById('pick').hidden=true;
  document.getElementById('kid').hidden=teen;document.getElementById('teen').hidden=!teen;
  (teen?renderTeen:renderKid)(k);
  document.querySelector('meta[name=theme-color]').content=teen?'#0E1424':'#FFF8EC';
  if(save)ls('ana-secim',k);
}
function pick(){
  document.body.className=document.documentElement.className='';
  document.documentElement.lang='ko';
  document.getElementById('pick').hidden=false;document.getElementById('kid').hidden=true;document.getElementById('teen').hidden=true;
  document.querySelector('meta[name=theme-color]').content='#0A0F1F';
  window.scrollTo(0,0);
}
document.querySelectorAll('#pick .btns button').forEach(b=>b.addEventListener('click',()=>{show(b.dataset.k,true);window.scrollTo(0,0);}));
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-k],a[data-pick]');if(!a)return;e.preventDefault();
  if(a.hasAttribute('data-pick'))pick();else{show(a.dataset.k,true);}
});
let k0=qs.get('q')||location.hash.slice(1);
if(D[k0])ls('ana-secim',k0);else k0=ls('ana-secim');
if(D[k0])show(k0,false);else pick();
</script>
</body>
</html>
